name: smoke

model:
  embed_dim: 8
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 1
  dropout: 0.0
  termination_mode: distance
  termination_distance_latent: encoded
  termination_distance: rms
  termination_distance_threshold: 0.2
  termination_distance_thresholds:
    bf: 0.2
    bfs: 0.2
    prim: 0.2
  termination_distance_signal: true
  termination_supervision_weight: 1.0
  termination_balance_loss: true
  evaluation_rollout_mode: autoregressive

training:
  epochs: 1
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  batch_size: 1
  eval_interval: 1
  seed: 42
  tasks: all

data:
  train_path: data/smoke/train.npz
  val_path: data/smoke/val.npz
  test_path: data/smoke/test.npz

logging:
  use_wandb: false
  log_interval: 1
  save_checkpoints: true
  checkpoint_interval: 1
  checkpoint_keep_last: 1

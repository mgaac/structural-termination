name: locked-termination

model:
  embed_dim: 32
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 2
  dropout: 0.1
  algorithms: [bf, bfs]
  termination_mode: distance
  termination_distance_latent: processed
  termination_distance: rms
  termination_distance_threshold: 0.2
  termination_distance_thresholds:
    bf: 0.2
    bfs: 0.2
  termination_distance_signal: true
  termination_supervision_weight: 1.0
  termination_balance_loss: true
  evaluation_rollout_mode: autoregressive

training:
  epochs: 100
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  batch_size: 10
  eval_interval: 10
  seed: 11
  tasks: all

data:
  train_path: data/locked/train_20n_1500g.npz
  val_path: data/locked/val_20n_200g.npz
  test_path: data/locked/test_id_20n_200g.npz

logging:
  use_wandb: false
  log_interval: 1
  save_checkpoints: true
  checkpoint_interval: 25
  checkpoint_keep_last: 2

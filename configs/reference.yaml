name: reference-checkpoint

model:
  embed_dim: 32
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 2
  dropout: 0.1
  algorithms: [bfs, bf]
  termination_mode: distance
  termination_distance_latent: processed
  termination_distance: l2
  termination_distance_threshold: 7.5
  termination_distance_signal: false
  evaluation_rollout_mode: teacher_forced

training:
  epochs: 500
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  batch_size: 10
  eval_interval: 10
  seed: 42
  tasks: all

data:
  train_path: artifacts/reference/data/test_20n_100g.npz
  val_path: artifacts/reference/data/test_20n_100g.npz
  test_path: artifacts/reference/data/test_200n_20g.npz

logging:
  use_wandb: false
  log_interval: 1
  save_checkpoints: false
  checkpoint_interval: 50
  checkpoint_keep_last: 5
